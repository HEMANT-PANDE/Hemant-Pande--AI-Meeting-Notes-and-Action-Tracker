name: nexora

# Self-contained stack: a local Postgres, the Express API, and the Next.js
# frontend. This is independent of the Neon setup used for local (non-Docker)
# development — nothing here touches Neon; DATABASE_URL is rebuilt to point
# at the `postgres` service below. Configure via a `.env` file next to this
# compose file (see `.env.docker.example`); every value has a safe local
# default so `docker compose up --build` works with zero configuration
# beyond an AI key (falls back to the mock provider without one).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-meeting_tracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-meeting_tracker}?schema=public
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Dev-only default so the stack runs with zero config. Override in
      # your own .env for anything beyond local/demo use.
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-this-is-not-secure}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # "mock" needs no key at all and still demonstrates the full flow;
      # switch to gemini/anthropic by setting AI_PROVIDER + the matching key.
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time (Next.js inlines NEXT_PUBLIC_* at build,
        # not at container start) — must be reachable from the *browser*,
        # so localhost:4000 (the mapped host port), not the service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
